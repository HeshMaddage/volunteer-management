spring:
  application:
    name: volunteer-management
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: validate # schema is owned by Flyway, never auto-generated
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    max-swallow-size: 10MB
    max-http-form-post-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-in-prod-please-use-a-long-random-string}
    expiration-ms: 86400000
  uploads:
    events-dir: ${EVENTS_UPLOAD_DIR:/app/uploads/events}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
