spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  jpa:
    show-sql: false

logging:
  level:
    root: INFO
    com.volunteer.management: INFO

app:
  jwt:
    secret: ${JWT_SECRET}
